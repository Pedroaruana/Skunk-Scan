<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-label="Fluxo de dados: SkunkScan">
<title>Fluxo de dados: SkunkScan</title>
<rect width="1000" height="640" fill="#121212"/>
<text x="40" y="62" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="26" font-weight="800" text-anchor="start" fill="#e6e6e6">Fluxo de dados: SkunkScan</text>
<text x="40" y="88" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#8a8a8a">FRONTEND ⇄ API ⇄ ARMAZENAMENTO E FONTES EXTERNAS</text>
<line x1="40" y1="102" x2="960" y2="102" stroke="#e6e6e6" stroke-width="1.4"/>
<rect x="40" y="130" width="250" height="190" rx="4" fill="#1a1a1a" stroke="#5a5a5a"/><rect x="40" y="130" width="5" height="190" fill="#6a6a6a"/><text x="60" y="158" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="start" fill="#e6e6e6">FRONTEND</text><text x="60" y="176" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#8a8a8a">React + Vite + TypeScript</text><text x="60" y="208" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="#e6e6e6">terminal que le o SSE</text><text x="60" y="229" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="#e6e6e6">estado do terminal no App</text><text x="60" y="250" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="#e6e6e6">historico so no navegador</text><text x="60" y="271" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="#e6e6e6">hospedado no GitHub Pages</text><rect x="375" y="130" width="250" height="190" rx="4" fill="#1a1a1a" stroke="#5a5a5a"/><rect x="375" y="130" width="5" height="190" fill="#f2f2f2"/><text x="395" y="158" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="start" fill="#e6e6e6">API</text><text x="395" y="176" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#8a8a8a">Cloudflare Worker · TypeScript</text><text x="395" y="208" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="#e6e6e6">valida e bloqueia alvo interno</text><text x="395" y="229" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="#e6e6e6">roda os 5 checks em ordem</text><text x="395" y="250" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="#e6e6e6">limite por IP e rota</text><text x="395" y="271" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="#e6e6e6">cron diario dos monitores</text><rect x="710" y="130" width="250" height="190" rx="4" fill="#1a1a1a" stroke="#5a5a5a"/><rect x="710" y="130" width="5" height="190" fill="#bdbdbd"/><text x="730" y="158" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="start" fill="#e6e6e6">ARMAZENAMENTO</text><text x="730" y="176" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#8a8a8a">D1 (SQLite) + Durable Object</text><text x="730" y="208" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="#e6e6e6">relatorios, notas e datas</text><text x="730" y="229" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="#e6e6e6">cache das respostas da IA</text><text x="730" y="250" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="#e6e6e6">monitores e tokens</text><text x="730" y="271" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="400" text-anchor="start" fill="#e6e6e6">contagem do limite por IP</text><line x1="290" y1="190" x2="366" y2="190" stroke="#e6e6e6" stroke-width="1.4"/><polygon points="375,190 366,194.5 366,185.5" fill="#e6e6e6"/><text x="332" y="180" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#8a8a8a">POST</text><line x1="375" y1="260" x2="299" y2="260" stroke="#e6e6e6" stroke-width="1.4"/><polygon points="290,260 299,255.5 299,264.5" fill="#e6e6e6"/><text x="332" y="284" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#8a8a8a">eventos SSE</text><line x1="625" y1="190" x2="701" y2="190" stroke="#e6e6e6" stroke-width="1.4"/><polygon points="710,190 701,194.5 701,185.5" fill="#e6e6e6"/><text x="667" y="180" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#8a8a8a">grava</text><line x1="710" y1="260" x2="634" y2="260" stroke="#e6e6e6" stroke-width="1.4"/><polygon points="625,260 634,255.5 634,264.5" fill="#e6e6e6"/><text x="667" y="284" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#8a8a8a">le</text><polyline points="500,320 500,370" fill="none" stroke="#e6e6e6" stroke-width="1.4"/><line x1="230" y1="370" x2="770" y2="370" stroke="#e6e6e6" stroke-width="1.4"/><line x1="230" y1="370" x2="230" y2="391" stroke="#e6e6e6" stroke-width="1.4"/><polygon points="230,400 225.5,391 234.5,391" fill="#e6e6e6"/><line x1="500" y1="370" x2="500" y2="391" stroke="#e6e6e6" stroke-width="1.4"/><polygon points="500,400 495.5,391 504.5,391" fill="#e6e6e6"/><line x1="770" y1="370" x2="770" y2="391" stroke="#e6e6e6" stroke-width="1.4"/><polygon points="770,400 765.5,391 774.5,391" fill="#e6e6e6"/><rect x="105" y="400" width="250" height="130" rx="4" fill="#1a1a1a" stroke="#5a5a5a"/><rect x="105" y="400" width="5" height="130" fill="#8a8a8a"/><text x="125" y="426" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="start" fill="#e6e6e6">O PROPRIO SITE</text><text x="125" y="443" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#8a8a8a">so leitura, uma requisicao</text><text x="125" y="470" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#e6e6e6">certificado e headers</text><text x="125" y="489" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#e6e6e6">redirecionamento para https</text><text x="125" y="508" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#e6e6e6">versao do servidor</text><rect x="375" y="400" width="250" height="130" rx="4" fill="#1a1a1a" stroke="#5a5a5a"/><rect x="375" y="400" width="5" height="130" fill="#8a8a8a"/><text x="395" y="426" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="start" fill="#e6e6e6">FONTES PUBLICAS</text><text x="395" y="443" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#8a8a8a">so leitura</text><text x="395" y="470" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#e6e6e6">DNS (DoH da Cloudflare)</text><text x="395" y="489" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#e6e6e6">Cert Spotter e crt.sh</text><text x="395" y="508" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#e6e6e6">NVD, base de CVEs</text><rect x="645" y="400" width="250" height="130" rx="4" fill="#1a1a1a" stroke="#5a5a5a"/><rect x="645" y="400" width="5" height="130" fill="#6a6a6a"/><text x="665" y="426" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="start" fill="#e6e6e6">WORKERS AI</text><text x="665" y="443" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#8a8a8a">modelo de linguagem</text><text x="665" y="470" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#e6e6e6">frase de onde aplicar a</text><text x="665" y="489" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#e6e6e6">correcao e respostas do chat</text><text x="665" y="508" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="start" fill="#e6e6e6">o codigo colado nunca vem dela</text><text x="500" y="570" font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="11" font-weight="400" text-anchor="middle" fill="#8a8a8a">cada varredura usa ~45 dos 50 subrequests de um Worker gratis; por isso os dominios parecidos ficam em outra rota</text>
</svg>
