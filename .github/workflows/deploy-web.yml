name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - web/**
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  # montar e publicar ficam em jobs separados: o GitHub demora um instante pra listar o arquivo recem enviado,
  # e publicar no mesmo job falhava com "Found 0 artifacts"
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    env:
      # endereco publico do Worker; o front le isso em tempo de build
      VITE_API_URL: https://skunkscan-api.aruanapedro.workers.dev
      # token publico do Cloudflare Web Analytics, vem de Settings > Variables > Actions; vazio = sem metricas
      VITE_CF_BEACON_TOKEN: ${{ vars.CF_BEACON_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Tipos e testes
        run: |
          npm run typecheck
          npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  pages:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
