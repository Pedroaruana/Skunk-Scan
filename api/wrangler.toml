name = "skunkscan-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[d1_databases]]
binding = "DB"
database_name = "skunkscan"
database_id = "ae589c1e-fdf6-4dba-ab51-5faf819e45f1"
migrations_dir = "migrations"

[ai]
binding = "AI"

# um monitor vencido por disparo: o limite de subrequests de um Worker cabe um scan so
[triggers]
crons = ["*/15 * * * *"]
