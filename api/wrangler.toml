name = "skunkscan-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[[d1_databases]]
binding = "DB"
database_name = "skunkscan"
# troque pelo id real depois de `wrangler d1 create skunkscan` (so o deploy precisa; local ignora)
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[ai]
binding = "AI"
