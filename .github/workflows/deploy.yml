name: Deploy

on:
  push:
    branches: [main]
    paths:
      - api/**
      - web/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

# deploy nunca roda em paralelo, mas tambem nao cancela um que ja comecou
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Tipos e testes
        run: |
          npm run typecheck
          npm test

      # sem os secrets o deploy e pulado (nao falha), pra nao deixar a main vermelha antes da configuracao
      - name: Deploy do Worker
        id: deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Secrets CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nao configurados. Deploy pulado."
            exit 0
          fi
          npx wrangler d1 migrations apply skunkscan --remote
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          if [ -z "$url" ]; then
            echo "::error::Nao achei a URL do Worker na saida do deploy."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

  web:
    needs: api
    if: needs.api.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # o front e um arquivo so; troca o endereco de exemplo da API pelo do Worker recem publicado
      - name: Apontar o front para a API
        env:
          API_URL: ${{ needs.api.outputs.url }}
        run: |
          sed -i "s#https://skunkscan-api.SEU-SUBDOMINIO.workers.dev#$API_URL#g" web/index.html
          if grep -q "SEU-SUBDOMINIO" web/index.html; then
            echo "::error::O endereco de exemplo da API continua no front."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - id: pages
        uses: actions/deploy-pages@v4
