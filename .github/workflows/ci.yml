name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# um push novo na mesma branch cancela a execucao anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      # aplica as migrations num D1 local vazio, pra um SQL com erro quebrar aqui e nao no deploy
      - name: Migrations
        run: npx wrangler d1 migrations apply skunkscan --local --persist-to "$RUNNER_TEMP/d1"
